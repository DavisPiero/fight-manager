function vFight(){const F=FS.f,ph=FS.ph;if(ph=="pre"){const A=F[0],B=F[1],row=(l,a,b)=>`<div class="tt"><b>${a}</b><span>${l}</span><b>${b}</b></div>`,side=(f,c)=>`<div class="fgt ${c}">${pv(f,170)}<h2>${f.name}</h2><div class="mu">${f.real?"":f.nat+" · "}${rkt(f)}</div></div>`;return`<div class="tape"><div class="mu">${WC[A.wc]} bout · week ${G.wk}</div><div class="vs">${side(A,"l")}<div class="mid"><div class="d" style="font-size:20px">Tale of the tape</div><div class="d vsx">VS</div>${row("RECORD",rec(A),rec(B))}${row("OVERALL",ovr(A),ovr(B))}${row("RANK",rkt(A),rkt(B))}${row("POPULARITY",A.pop,B.pop)}${row("STYLE",A.style,B.style)}${row("ROUNDS",3,3)}</div>${side(B,"r")}</div><div class="pn"><h2>Pick your game plan</h2><div class="mu">Sets how your fighter approaches round 1. You can change it between rounds.</div><div class="row">${[["norm","Balanced","even"],["agg","Pressure","more damage both ways"],["safe","Counter","less risk"],["td","Wrestle","look for takedowns"]].map(([k,t,d])=>`<button class="tile" data-a="plan" data-i="${k}">${t}<small>${d}</small></button>`).join("")}</div></div></div>`}
 const ctl=ph=="ins"?`<div class="pn"><h2>Corner advice: round ${FS.rd}</h2><div class="mu" style="margin-bottom:6px">Round ${FS.rd-1} cards: ${FS.cards.map(c=>c[c.length-1].join("-")).join(" · ")}</div><div class="row">${[["norm","Keep it up"],["agg","Go for the finish"],["safe","Stay safe"],["td","Take him down"]].map(([k,t])=>`<button class="tile" data-a="plan" data-i="${k}">${t}</button>`).join("")}</div></div>`:ph=="end"?endCard():"";return`<div id="hud" class="hud"></div><canvas id="cv" width="320" height="170" style="image-rendering:pixelated"></canvas><div class="cm" id="cm"></div>${ctl}`}
function endCard(){const r=FS.res,F=FS.f,W=F[r.w],ko=/KO|submission/.test(r.how),e=FS.ea,tm=Math.floor(e.e/60)+":"+String(e.e%60).padStart(2,"0"),rt=x=>x==0?"CHAMP":x<=15?"#"+x:"NR";return`<div class="pn" style="text-align:center"><div class="big" style="color:${r.won?"var(--gr)":"var(--rd)"}">${ko?(r.won?"Knockout!":"Knocked out"):r.won?"Victory":"Defeat"}</div><div class="d" style="font-size:22px">${W.name} by ${r.how}</div><div class="mu">${/decision/.test(r.how)?"After 3 rounds":"Round "+e.rd+" · "+tm}</div><div style="text-align:left;margin-top:10px"><div class="lg"><span>Strikes landed</span><b>${FS.stt[0][0]} - ${FS.stt[1][0]}</b></div><div class="lg"><span>Takedowns</span><b>${FS.stt[0][1]} - ${FS.stt[1][1]}</b></div><div class="lg"><span>${F[0].name.split(" ").pop()}'s record</span><b>${rec(F[0])}</b></div><div class="lg"><span>Ranking</span><b>${rt(FS.r0[0])} → ${rt(FS.rk1[0])}</b></div><div class="lg"><span>Purse</span><b>${money(r.pay)}</b></div><div class="lg"><span>Your commission</span><b style="color:var(--gd)" id="cu" data-v="${r.cut}">${money(r.cut)}</b></div>${r.wks?`<div class="lg"><span>Injury</span><b style="color:var(--rd)">${r.wks} weeks</b></div>`:""}</div><button class="b" data-a="done" style="margin-top:12px">Back to the agency</button></div>`}
function vMenu(){return`<div style="min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:440px"><div class="big">Fight<br><span style="color:var(--rd)">Camp</span></div><p class="mu">Sign the talent. Build the camp. Work the corner. Make champions.</p><button class="b" data-a="new">New career</button><button class="b g" data-a="cont" ${load()?"":"disabled"}>Continue</button><div class="mu" style="font-size:12px">Unofficial fan project. Ratings are the game’s own estimates.</div></div>`}
function vNew(){const c=UI.c;return`<h1 style="font-size:42px;margin-bottom:12px">Open your agency</h1><input id="an" type="text" maxlength="26" placeholder="Agency name" value="${c.name}"><div class="row">${COLS.map((k,i)=>`<button class="tile ${c.col==i?"on":""}" data-a="ccol" data-i="${i}" style="border-bottom:8px solid ${k}">Colour</button>`).join("")}</div><div class="row">${["Easy","Normal","Hard"].map(d=>`<button class="tile ${c.diff==d?"on":""}" data-a="cdiff" data-i="${d}">${d}<small>${{Easy:"$400k",Normal:"$250k",Hard:"$120k"}[d]}</small></button>`).join("")}</div><button class="b" data-a="start">Open the doors</button> <button class="b g" data-a="menu">Back</button>`}
function vProf(){const f=G.f[UI.pid];return vProf0()+`<div class="gr c2"><div class="pn"><h2>Ability radar</h2>${radar(f)}</div><div class="pn"><h2>Development</h2>${f.st=="mine"?line(f.hist||[ovr(f)],"#e5a52c"):'<div class="mu">Tracked for fighters you manage.</div>'}<h2 style="margin-top:12px">Career timeline</h2>${(f.tl||[]).slice().reverse().slice(0,8).map(e=>`<div class="lg"><span>Week ${e.w}</span><b>${e.t}</b></div>`).join("")||'<div class="mu">No events yet.</div>'}</div></div>`}
let LV="";function render(){const a=$("#app");let h;if(V=="menu")h=vMenu();else if(V=="new")h=vNew();else{const v=({home:vHome,roster:vRoster,gym:vGym,fights:vFights,mk:vMk,rk:vRk,fin:vFin,hist:vHist,prof:vProf,fight:vFight}[V])||vHome;h=`<div class="shell">${side()}<main id="main" class="${V!=LV?"vin":""}">${hdr()}${v()}</main></div>`;if(UI.md&&V!="fight")h+=UI.md}
 LV=V;a.innerHTML=h;if(V=="fight"){if(FS.ph=="end"&&!FS.cu){FS.cu=1;countUp()}hud();if(!anim)anim=requestAnimationFrame(frame)}
 if(V=="prof"){const c=$("#pf");if(c){const x=c.getContext("2d");x.fillStyle="#26292e";x.fillRect(0,0,240,220);sprite(x,120,200,1.6,1,G.f[UI.pid],"stand",0)}}
 if(V=="gym"&&!gA)gA=requestAnimationFrame(gframe);
 if(G&&V!="menu"&&V!="new"&&V!="fight"){const e=$("#cash");if(e&&UI.lc!=null&&UI.lc!=G.cash){const a0=UI.lc,b0=G.cash,t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/600);e.textContent=money(a0+(b0-a0)*k);if(k<1)requestAnimationFrame(s)})(t0)}UI.lc=G.cash}}
function neg(id){const f=G.f[id],a=askOf(f);UI.md=`<div class="md"><div class="pn"><div style="display:flex;gap:12px;align-items:center">${pv(f,96)}<div><h2>${f.name}</h2><div class="mu">${WC[f.wc]} · ${rec(f)} · OVR ${ovr(f)}</div>${tag(f)}</div></div><div class="mu" style="margin:8px 0">${f.real?"A star. He wants a manager with real clout.":"Expects a signing bonus and a fair cut."}</div><div class="lg"><span>Their ask</span><b>${money(a)}</b></div><div class="lg"><span>Your offer</span><b id="of"></b></div><label>Management cut: <b id="vc">20%</b></label><input type="range" id="rc" min="10" max="35" value="20"><label>Signing bonus: <b id="vb">${money(a)}</b></label><input type="range" id="rb" min="0" max="${a*2}" step="500" value="${a}"><div class="d" style="font-size:36px;text-align:center" id="pc"></div><div class="row"><button class="b g" data-a="mclose">Walk away</button><button class="b" data-a="offer" data-i="${id}">Make offer</button></div></div></div>`;render();upd(f)}
function upd(f){const c=+$("#rc").value,b=+$("#rb").value,p=chance(f,c,b);$("#vc").textContent=c+"%";$("#vb").textContent=money(b);$("#of").textContent=money(b)+" · "+c+"%";const e=$("#pc");e.textContent=Math.round(p*100)+"% chance";e.style.color=oc(p*100)}
document.addEventListener("input",e=>{if(e.target.id=="vol"){SND.vol=e.target.value/100;saveSnd();return}if(e.target.id=="rc"||e.target.id=="rb")upd(G.f[UI.nid])});
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,i=t.dataset.i;sfx("tick");
 if(a=="go")go(i);else if(a=="menu")go("menu");else if(a=="new")go("new");else if(a=="cont"){G=load();initG();go("home")}
 else if(a=="ccol"){UI.c.name=$("#an").value;UI.c.col=+i;render()}else if(a=="cdiff"){UI.c.name=$("#an").value;UI.c.diff=i;render()}
 else if(a=="start"){const n=$("#an").value.trim();if(!n){$("#an").focus();return}UI.c.name=n;G=newGame(UI.c);initG();save();go("home")}
 else if(a=="prof"){UI.pid=+i;go("prof")}else if(a=="gsel"){UI.gym=+i;render()}else if(a=="foc"){UI.foc=i;render()}else if(a=="int"){UI.int=+i;render()}else if(a=="train")train();
 else if(a=="div"){UI.div=+i;render()}else if(a=="mkt"){UI.mk=+i;render()}
 else if(a=="adv"){advance()}
 else if(a=="seek"){G.offers.push(...offersFor(G.f[+i]));if(!G.offers.some(o=>o.fid==+i))toast("No opponents");render()}
 else if(a=="push"){const o=G.offers[+i];o.push=1;if(R()<.3){G.offers.splice(+i,1);toast("Offer pulled!")}else{o.purse=Math.round(o.purse*1.2/100)*100;o.bonus=o.purse;toast("+20% purse")}render()}
 else if(a=="acc"){const o=G.offers[+i];G.bk.push(o);G.offers=G.offers.filter(x=>x.fid!=o.fid);say(`${G.f[o.fid].name} booked vs ${G.f[o.oid].name} for week ${o.wk}.`);save();render()}
 else if(a=="neg"){UI.nid=+i;neg(+i)}else if(a=="mclose"){UI.md=null;render()}
 else if(a=="offer"){const f=G.f[+i],c=+$("#rc").value,b=+$("#rb").value;if(G.ro.length>=6){toast("Roster full");return}if(G.cash<b){toast("Not enough cash");return}if(f.lock>G.wk){toast("He won't talk yet");return}t.classList.add("ld");t.disabled=true;setTimeout(()=>{UI.md=null;if(R()<chance(f,c,b)){G.cash-=b;G.fin.exp+=b;f.st="mine";f.ct={pct:c,yrs:3};f.hist=[ovr(f)];(f.tl=f.tl||[]).push({w:G.wk,t:"Signed by your agency"});G.ro.push(f.id);say(`Signed ${f.name}.`);stamp("SIGNED");confetti(70);sfx("win")}else{f.lock=G.wk+4;toast("Rejected");say(`${f.name} turned you down.`)}save();render()},800)}
 else if(a=="gz"){const r=t.getBoundingClientRect(),z=GZ[Math.min(4,Math.max(0,Math.floor((e.clientX-r.left)/r.width*5)))],k=z[1],ix=k.indexOf(UI.foc);UI.foc=k[(ix+1)%k.length];UI.gh=GZ.indexOf(z);render()}
 else if(a=="bell"){G.seen=G.ln;UI.md=`<div class="md"><div class="pn"><h2>Notifications</h2>${G.log.slice(0,10).map(l=>`<div class="lg">${l}</div>`).join("")}<div class="row"><button class="b g" data-a="mclose">Close</button></div></div></div>`;render()}
 else if(a=="snd"){SND.on=SND.on?0:1;saveSnd();render()}
 else if(a=="set"){UI.md=`<div class="md"><div class="pn"><h2>Settings</h2><label>Volume: <b>${Math.round(SND.vol*100)}%</b></label><input type="range" id="vol" min="0" max="100" value="${SND.vol*100}"><div class="row"><button class="b g" data-a="snd">Sound: ${SND.on?"On":"Muted"}</button><button class="b" data-a="mclose">Done</button></div><div class="mu">Your career saves automatically.</div></div></div>`;render()}
 else if(a=="plan"){if(FS.ph=="pre"||FS.ph=="ins"){FS.ins[0]=i;FS.ins[1]=pk(["norm","agg","safe","td"]);if(FS.ph=="pre"){FS.ph="run";go("fight")}playRound()}}
 else if(a=="done"){FS=null;go("home")}});
(function(){const c=document.createElement("canvas");c.width=c.height=12;let u="";try{const x=c.getContext("2d");x.fillStyle="#d71920";x.fillRect(2,2,8,7);x.fillRect(1,4,2,4);x.fillStyle="#8e1118";x.fillRect(2,8,8,2);x.fillStyle="#f0f0ec";x.fillRect(4,10,5,2);u=c.toDataURL()}catch(e){}const m=["Taping hands...","Calling matchmakers...","Scouting prospects...","Warming up the gym..."];$("#app").innerHTML=`<div class="boot"><div><img src="${u}" alt=""><div class="big" style="font-size:44px;margin-top:14px">Fight Camp</div><div class="mu">${m[Math.floor(Math.random()*4)]}</div></div></div>`;setTimeout(()=>go("menu"),1100)})();
</script></body></html>
